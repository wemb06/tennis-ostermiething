<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UTC Ostermiething — Vereinsmeisterschaft 2026</title>
    <meta
      name="description"
      content="Spielplan und Ergebnisse der Vereinsmeisterschaft 2026 des UTC Ostermiething: nächste Spiele, Resultate und das Raster von A- und B-Bewerb."
    />
    <meta name="theme-color" content="#c25a2e" />

    <!-- Vorschau, wenn der Link in WhatsApp geteilt wird -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UTC Ostermiething" />
    <meta property="og:title" content="Vereinsmeisterschaft 2026 — Spielplan & Ergebnisse" />
    <meta
      property="og:description"
      content="Wer spielt als Nächstes, wann und auf welchem Platz? Alle Ergebnisse und das Raster von A- und B-Bewerb."
    />
    <meta property="og:url" content="https://wemb06.github.io/tennis-ostermiething/" />
    <meta property="og:image" content="https://wemb06.github.io/tennis-ostermiething/bilder/og-bild.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="bilder/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="bilder/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <header class="kopf">
      <div class="kopf-oben">
        <div class="kopf-text">
          <p class="verein">UTC Ostermiething</p>
          <h1 class="titel">Vereinsmeisterschaft 2026</h1>
        </div>
        <button id="aktualisieren" class="knopf-rund" type="button" title="Daten neu laden" aria-label="Daten neu laden">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <p id="stand" class="stand">Daten werden geladen …</p>
      <div id="bewerbwahl" class="segment" role="group" aria-label="Bewerb wählen"></div>
    </header>

    <main id="inhalt" class="inhalt" aria-live="polite">
      <p class="hinweis-laden">Spielplan wird geladen …</p>
    </main>

    <nav class="tableiste" aria-label="Ansicht">
      <button type="button" class="tab" data-ansicht="naechste">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M7 3v3M17 3v3M4 9h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <span>Nächste Spiele</span>
      </button>
      <button type="button" class="tab" data-ansicht="ergebnisse">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M4 7h16M4 12h16M4 17h9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <span>Ergebnisse</span>
      </button>
      <button type="button" class="tab" data-ansicht="raster">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M3 5h6v4H3zM3 15h6v4H3zM13 10h6v4h-6zM9 7h2v5h2M9 17h2v-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
        <span>Raster</span>
      </button>
    </nav>

    <dialog id="detail" class="detail">
      <div id="detail-inhalt"></div>
      <form method="dialog"><button class="knopf-breit" type="submit">Schließen</button></form>
    </dialog>

    <noscript>
      <p class="hinweis-laden">
        Für diese Seite muss JavaScript aktiviert sein — der Spielplan wird im Browser aus der Turnierdatei aufgebaut.
      </p>
    </noscript>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
